# Pantallas nice!view: izquierda con nice_view_bongo, derecha con
# nice_view_magikarp (ambos en module/boards/shields)
CONFIG_ZMK_DISPLAY=y

# Deep sleep tras 15 min sin uso (por defecto) para ahorrar batería.
# Se despierta pulsando cualquier tecla.
CONFIG_ZMK_SLEEP=y

# Potencia de transmisión BLE máxima del nRF52840 (+8 dBm) para más alcance,
# como el firmware de fábrica de FunkeeB.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
